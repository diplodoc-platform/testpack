default:
  project_name: Diplodoc
  env: test
  version: 5.55
  items:
    - name: Alpha
      value: First
    - name: Beta
      value: Second
    - name: Gamma
      value: Third
  schema_info:
    package: '@diplodoc/ajv'
    version: '0.4.4'
    schemas:
      - frontmatter
      - toc
      - redirects
      - theme
  liquid_user:
    name: alice
    role: editor
    age: 25
    active: true
    address:
      city: Moscow
  liquid_greeting: hello world
  liquid_tags:
    - premium
    - vip
  liquid_groups:
    - name: Alpha
      members:
        - Alice
        - Ivan
    - name: Beta
      members:
        - Petr
        - Olga
  liquid_word: Pasha
  liquid_range:
    - 1
    - 2
    - 3
  infra_info:
    package: '@diplodoc/infra'
    version: '2.2.3'
    description: 'Central infrastructure package for linting, CI workflows, and scaffolding'
    binaries:
      - lint
      - infra
    exports:
      - eslint-config
      - prettier-config
      - stylelint-config
      - esbuild
  vsc_info:
    package: 'diplodoc-vsc-extension'
    version: '1.4.1'
    description: 'VS Code extension for Diplodoc — schema validation, linting, and visual editors'
    editor_mode: 'wysiwyg'
    commands:
      - diplodoc.openMdEditor
      - diplodoc.openTocEditor
      - diplodoc.initProject
      - diplodoc.insertTable
      - diplodoc.insertNote
      - diplodoc.insertCut
      - diplodoc.insertTab
      - diplodoc.insertCodeBlock
      - diplodoc.insertInclude
      - diplodoc.insertQuote
      - diplodoc.insertMermaid
      - diplodoc.insertFrontmatter
      - diplodoc.insertPageConstructor
      - diplodoc.insertHtmlBlock
      - diplodoc.insertVideo
      - diplodoc.insertComment
      - diplodoc.findFileReferences
  directive_info:
    package: '@diplodoc/directive'
    version: '0.3.6'
    description: 'Pluggable parser for directive syntax in markdown markup'
    syntax_forms:
      - name: Inline
        marker: ':name'
        description: 'Inline directive found in text flow'
      - name: Leaf block
        marker: '::name'
        description: 'Leaf block directive without content'
      - name: Container block
        marker: ':::name'
        description: 'Container block directive with content between :::name and :::'
  algolia_info:
    package: '@diplodoc/algolia-extension'
    version: '0.7.1'
    description: 'Algolia search integration extension for Diplodoc — indexing and client-side search'
    options:
      - flag: '--app-id <id>'
        description: 'Algolia Application ID'
      - flag: '--api-key <key>'
        description: 'Algolia API Key'
      - flag: '--index-name <name>'
        description: 'Algolia Index Name'
      - flag: '--index [boolean]'
        description: 'Whether to create and upload an index for search'
      - flag: '--search-api-key <key>'
        description: 'Client-side API key for search'
      - flag: '--search-provider <name>'
        description: 'Search provider name'
      - flag: '--search-api <path>'
        description: 'Path to the client-side search API'
    dependencies:
      - '@diplodoc/search-extension'
      - algoliasearch
      - cheerio
      - lodash
      - ts-dedent
  testpack_info:
    package: '@diplodoc/testpack'
    version: '1.0.1'
    description: 'E2E test infrastructure for the Diplodoc documentation platform'
    scripts:
      - name: 'npm run build'
        description: 'Build config, server, and tests via esbuild'
      - name: 'npm run start'
        description: 'Build and start the Express test server'
      - name: 'npm run test'
        description: 'Bootstrap and run Playwright test suites'
      - name: 'npm run docs'
        description: 'Build YFM fixtures via @diplodoc/cli'
      - name: 'npm run lint'
        description: 'Run ESLint and Prettier checks'
    exports:
      - '@diplodoc/testpack/config'
      - '@diplodoc/testpack/server'
      - '@diplodoc/testpack/tests'

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E0E0E0" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="300" height="200" fill="url(#grid)"/>
  <g transform="translate(150,100)">
    <path d="M -50 -30 L 50 -30 L 50 30 L -50 30 Z" fill="#4A90D9" stroke="#333" transform="rotate(15)"/>
    <path d="M -30 -30 L 30 -30 L 30 30 L -30 30 Z" fill="#50C878" opacity="0.8" transform="rotate(45) scale(0.8)"/>
    <path d="M -20 -20 L 20 -20 L 20 20 L -20 20 Z" fill="#FF6B6B" opacity="0.6" transform="rotate(75) scale(0.6)"/>
  </g>
  <text x="150" y="180" text-anchor="middle" font-size="12" fill="#333">Transforms &amp; Paths</text>
</svg>

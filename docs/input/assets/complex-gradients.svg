<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="lg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="50%" stop-color="#4ECDC4"/>
      <stop offset="100%" stop-color="#45B7D1"/>
    </linearGradient>
    <linearGradient id="lg2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#96E6A1"/>
      <stop offset="100%" stop-color="#84FAB0"/>
    </linearGradient>
    <radialGradient id="rg1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FA709A"/>
      <stop offset="100%" stop-color="#FEE140"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="#FAFAFA"/>
  <rect x="20" y="20" width="150" height="100" fill="url(#lg1)" rx="8"/>
  <rect x="200" y="20" width="150" height="100" fill="url(#lg2)" rx="8"/>
  <circle cx="100" cy="200" r="60" fill="url(#rg1)" filter="url(#blur)"/>
  <circle cx="280" cy="200" r="60" fill="url(#lg1)" opacity="0.7"/>
  <text x="200" y="280" text-anchor="middle" font-size="14" fill="#333">Gradients &amp; Filters Test</text>
</svg>

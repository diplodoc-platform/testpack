name: Downstream Check

# Downstream Check is triggered for core package PRs (transform, components, cli)
# to verify downstream impact. It checks out the metapackage, replaces the core
# package submodule with the PR SHA, builds all downstream consumers, and runs
# semantic + visual comparison of the testpack corpus.
#
# This workflow is reusable — called from core package repositories through
# workflow_call, or triggered manually with workflow_dispatch.

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Core package name (transform, components, cli)'
        required: true
        type: choice
        options:
          - transform
          - components
          - cli
      pr-sha:
        description: 'PR commit SHA to replace the submodule with'
        required: true
        type: string
      pr-number:
        description: 'PR number for reporting (optional)'
        required: false
        type: string
  workflow_call:
    inputs:
      package:
        description: 'Core package name (transform, components, cli)'
        required: true
        type: string
      pr-sha:
        description: 'PR commit SHA to replace the submodule with'
        required: true
        type: string
      pr-number:
        description: 'PR number for reporting (optional)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  downstream-check:
    name: Downstream Check (${{ inputs.package }})
    runs-on: ubuntu-24.04
    env:
      CI: 'true'
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Checkout metapackage (with submodules)
        uses: actions/checkout@v5
        with:
          repository: diplodoc-platform/diplodoc
          ref: master
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Resolve SHAs
        id: shas
        run: |
          BASE_SHA=$(git rev-parse HEAD)
          echo "base-sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"
          if [[ ! "${{ inputs.pr-sha }}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "pr-sha must be a full 40-character hexadecimal commit SHA"
            exit 1
          fi
          echo "head-sha=${{ inputs.pr-sha }}" >> "$GITHUB_OUTPUT"

      - name: Record base package export state
        run: |
          npm run build --workspace "@diplodoc/${{ inputs.package }}"
          node devops/testpack/scripts/check-package-types.js \
            --package-dir "packages/${{ inputs.package }}" \
            --output artifacts/base-package-targets.json \
            --allow-invalid

      - name: Build corpus (base SHA — expected)
        run: |
          cd devops/testpack
          npm ci
          npm run docs
          mkdir -p "${{ github.workspace }}/artifacts/expected"
          cp -r docs/output "${{ github.workspace }}/artifacts/expected/output"

      - name: Replace submodule with PR SHA
        run: |
          PACKAGE="${{ inputs.package }}"
          case "${PACKAGE}" in
            transform) SUBMODULE="packages/transform" ;;
            components) SUBMODULE="packages/components" ;;
            cli) SUBMODULE="packages/cli" ;;
            *) echo "Unknown package: ${PACKAGE}"; exit 1 ;;
          esac
          cd "${SUBMODULE}"
          git fetch origin
          git checkout --detach "${{ inputs.pr-sha }}"
          cd "${{ github.workspace }}"

      - name: Rebuild metapackage dependencies
        run: |
          npm ci
          npm run build --workspaces

      - name: Verify built package exports from the real workspace
        run: |
          node devops/testpack/scripts/check-package-types.js \
            --package-dir "packages/${{ inputs.package }}" \
            --baseline artifacts/base-package-targets.json

      - name: Run changed package tests
        run: npm test --workspace "@diplodoc/${{ inputs.package }}" --if-present

      - name: Build corpus (candidate SHA — actual)
        run: |
          cd devops/testpack
          npm run docs
          mkdir -p "${{ github.workspace }}/artifacts/actual"
          cp -r docs/output "${{ github.workspace }}/artifacts/actual/output"

      - name: Run candidate testpack E2E and visual regression
        run: npm test
        working-directory: devops/testpack

      - name: Run downstream check
        id: downstream
        continue-on-error: true
        run: |
          node devops/testpack/scripts/downstream-check.js \
            --package "${{ inputs.package }}" \
            --pr-sha "${{ inputs.pr-sha }}" \
            --expected artifacts/expected/output/ \
            --actual artifacts/actual/output/ \
            --output artifacts/downstream/ \
            --report artifacts/downstream-report.md

      - name: Upload downstream check artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downstream-check-${{ inputs.package }}
          path: |
            artifacts/downstream/
            artifacts/downstream-report.md
            artifacts/expected/
            artifacts/actual/
            artifacts/base-package-targets.json
          retention-days: 30

      - name: Write downstream report to job summary
        if: always()
        run: |
          if [ -f artifacts/downstream-report.md ]; then
            cat artifacts/downstream-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if downstream check failed
        if: steps.downstream.outcome == 'failure'
        run: exit 1

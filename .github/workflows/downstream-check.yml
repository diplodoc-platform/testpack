name: Components type-fix diagnostic (manual only)
# Candidate execution is isolated from the reference and from trusted comparison.
# Package artifacts are data, not scripts to execute in the comparison job.
'on':
  workflow_dispatch:
    inputs:
      package:
        description: Repository name from infra/distribution.yml
        required: true
        type: string
      pr-sha:
        description: Full candidate commit SHA
        required: true
        type: string
      pr-number:
        description: PR number for reporting (optional)
        required: false
        type: string
      profile:
        description: Verification profile selected by dependency risk assessment
        required: true
        default: document-transform
        type: choice
        options:
          - document-transform
          - document-rendering
          - ecosystem
permissions:
  contents: read
jobs:
  prepare:
    name: Resolve immutable inputs (no package code)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      path: ${{ steps.package.outputs.path }}
      name: ${{ steps.package.outputs.name }}
      base-sha: ${{ steps.package.outputs.base-sha }}
      metapackage-sha: ${{ steps.package.outputs.metapackage-sha }}
    steps:
      - name: Require the bounded manual components pilot
        env:
          EVENT_NAME: ${{ github.event_name }}
          PACKAGE: ${{ inputs.package }}
          PROFILE: ${{ inputs.profile }}
        run: |
          test "$EVENT_NAME" = workflow_dispatch
          test "$PACKAGE" = components
          test "$PROFILE" = document-rendering
      - name: Require trusted workflow identity
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$WORKFLOW_REPOSITORY" == diplodoc-platform/testpack ]] || { echo 'Unexpected tool repository'; exit 1; }
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'Missing immutable workflow SHA'; exit 1; }
      - name: Checkout verification tools
        uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tools/testpack
          persist-credentials: false
      - name: Validate inputs
        env:
          REPOSITORY_NAME: ${{ inputs.package }}
          EXPECTED_SHA: ${{ inputs.pr-sha }}
          PROFILE: ${{ inputs.profile }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: node tools/testpack/scripts/verification-setup.js validate
      - name: Checkout candidate repository at exact SHA
        uses: actions/checkout@v5
        with:
          repository: diplodoc-platform/${{ inputs.package }}
          ref: ${{ inputs.pr-sha }}
          path: candidate-package
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout metapackage with submodules
        uses: actions/checkout@v5
        with:
          repository: diplodoc-platform/diplodoc
          ref: 3446348576fe5d5bba8fc26ad80c03f1c7e750d6
          path: metapackage
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}
      - name: Resolve package metadata and verify candidate SHA
        id: package
        env:
          REPOSITORY_NAME: ${{ inputs.package }}
          EXPECTED_SHA: ${{ inputs.pr-sha }}
          PROFILE: ${{ inputs.profile }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: node tools/testpack/scripts/verification-setup.js metadata
  baseline:
    name: Build reference on an isolated runner
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: 'true'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      REPOSITORY_NAME: ${{ inputs.package }}
      PR_SHA: ${{ inputs.pr-sha }}
      PACKAGE_PATH: ${{ needs.prepare.outputs.path }}
      PACKAGE_NAME: ${{ needs.prepare.outputs.name }}
    outputs:
      artifact-id: ${{ steps.evidence.outputs.artifact-id }}
    steps:
      - name: Require trusted workflow identity
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$WORKFLOW_REPOSITORY" == diplodoc-platform/testpack ]] || { echo 'Unexpected tool repository'; exit 1; }
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'Missing immutable workflow SHA'; exit 1; }
      - name: Checkout verification tools
        uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tools/testpack
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}
      - name: Checkout standalone baseline at metapackage SHA
        uses: actions/checkout@v5
        with:
          repository: diplodoc-platform/${{ inputs.package }}
          ref: ${{ needs.prepare.outputs.base-sha }}
          path: baseline-package
          persist-credentials: false
      - name: Checkout metapackage with submodules
        uses: actions/checkout@v5
        with:
          repository: diplodoc-platform/diplodoc
          ref: ${{ needs.prepare.outputs.metapackage-sha }}
          path: metapackage
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Apply the same exact client fix to both sides (diagnostic only)
        env:
          CLIENT_SHA: 1532c3c0b32968a18817fe63f520e21d528fe156
        run: |
          git -C metapackage/packages/client fetch --no-tags https://github.com/diplodoc-platform/client.git "$CLIENT_SHA"
          git -C metapackage/packages/client checkout --detach "$CLIENT_SHA"
          test "$(git -C metapackage/packages/client rev-parse HEAD)" = "$CLIENT_SHA"
          echo "Diagnostic client override: $CLIENT_SHA (not released or merged)" >> "$GITHUB_STEP_SUMMARY"
      - name: Build standalone baseline and record export state
        run: |
          npm ci --ignore-scripts
          npm run build --if-present
          node ../tools/testpack/scripts/check-package-types.js \
            --package-dir . \
            --output ../artifacts/base-standalone-package-targets.json \
            --allow-invalid
        working-directory: baseline-package
      - name: Resolve base metapackage lock and install
        run: |
          npm install --package-lock-only --ignore-scripts
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          npm ci
          node ../tools/testpack/scripts/workspace-lock.js \
            --command overlay --package "$REPOSITORY_NAME" --workspace . \
            --standalone "$GITHUB_WORKSPACE/baseline-package" \
            --output "$GITHUB_WORKSPACE/artifacts/base-lock-plan.json"
          cp package-lock.json "$GITHUB_WORKSPACE/artifacts/base-metapackage-lock.json"
          node ../tools/testpack/scripts/workspace-lock.js \
            --command verify --workspace . \
            --plan "$GITHUB_WORKSPACE/artifacts/base-lock-plan.json" \
            --output "$GITHUB_WORKSPACE/artifacts/base-dependency-resolution.json"
        working-directory: metapackage
      - name: Build base testpack dependency graph
        run: npm run build
        working-directory: metapackage
      - name: Prove the baseline components source reaches both consumers
        env:
          EXPECTED_SOURCE: ${{ needs.prepare.outputs.base-sha }}
        run: node tools/testpack/scripts/diagnostic-components-binding.cjs metapackage "$EXPECTED_SOURCE" artifacts/base-source-binding.json
      - name: Install reference Playwright browser when required
        if: inputs.profile != 'document-transform'
        run: npx playwright install --with-deps chromium
        working-directory: metapackage/devops/testpack
      - name: Record base package export state
        env:
          PACKAGE_PATH: ${{ needs.prepare.outputs.path }}
        run: |
          node ../tools/testpack/scripts/check-package-types.js \
            --package-dir "${PACKAGE_PATH}" \
            --output ../artifacts/base-package-targets.json \
            --allow-invalid
        working-directory: metapackage
      - name: Build reference HTML and Markdown corpus
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/expected/html"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/expected/md"
          node ../../packages/cli/build/index.js build \
            -i docs/input \
            -o "$GITHUB_WORKSPACE/artifacts/expected/html/output" \
            --output-format html
          node ../../packages/cli/build/index.js build \
            -i docs/input \
            -o "$GITHUB_WORKSPACE/artifacts/expected/md/output" \
            --output-format md
        working-directory: metapackage/devops/testpack
      - name: Record base downstream consumer state
        id: base-downstream
        continue-on-error: true
        run: |
          node tools/testpack/scripts/downstream-check.js \
            --package "$REPOSITORY_NAME" \
            --metapackage-root metapackage \
            --skip-corpus true \
            --output artifacts/base-downstream/ \
            --report artifacts/base-downstream-report.md
      - name: Recheck baseline resolutions after builds and consumer tests
        run: |
          node tools/testpack/scripts/workspace-lock.js \
            --command verify --workspace metapackage \
            --plan artifacts/base-lock-plan.json \
            --output artifacts/base-dependency-resolution.json
          node tools/testpack/scripts/diagnostic-components-binding.cjs metapackage "${{ needs.prepare.outputs.base-sha }}" artifacts/base-source-binding.json
      - name: Upload isolated baseline evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-baseline-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.package }}-${{ inputs.pr-sha }}-${{ inputs.profile }}
          path: artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  candidate:
    name: Build candidate on an isolated runner
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: 'true'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      REPOSITORY_NAME: ${{ inputs.package }}
      PR_SHA: ${{ inputs.pr-sha }}
      PACKAGE_PATH: ${{ needs.prepare.outputs.path }}
      PACKAGE_NAME: ${{ needs.prepare.outputs.name }}
    outputs:
      artifact-id: ${{ steps.evidence.outputs.artifact-id }}
    steps:
      - name: Require trusted workflow identity
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$WORKFLOW_REPOSITORY" == diplodoc-platform/testpack ]] || { echo 'Unexpected tool repository'; exit 1; }
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'Missing immutable workflow SHA'; exit 1; }
      - name: Checkout verification tools
        uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tools/testpack
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}
      - name: Checkout candidate repository at exact SHA
        uses: actions/checkout@v5
        with:
          repository: diplodoc-platform/${{ inputs.package }}
          ref: ${{ inputs.pr-sha }}
          path: candidate-package
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout metapackage with submodules
        uses: actions/checkout@v5
        with:
          repository: diplodoc-platform/diplodoc
          ref: ${{ needs.prepare.outputs.metapackage-sha }}
          path: metapackage
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Apply the same exact client fix to both sides (diagnostic only)
        env:
          CLIENT_SHA: 1532c3c0b32968a18817fe63f520e21d528fe156
        run: |
          git -C metapackage/packages/client fetch --no-tags https://github.com/diplodoc-platform/client.git "$CLIENT_SHA"
          git -C metapackage/packages/client checkout --detach "$CLIENT_SHA"
          test "$(git -C metapackage/packages/client rev-parse HEAD)" = "$CLIENT_SHA"
          echo "Diagnostic client override: $CLIENT_SHA (not released or merged)" >> "$GITHUB_STEP_SUMMARY"
      - name: Install candidate from its own lockfile
        run: npm ci --ignore-scripts
        working-directory: candidate-package
      - name: Install candidate Playwright browser when required
        if: inputs.profile != 'document-transform' || inputs.package == 'testpack'
        run: npx playwright install --with-deps chromium
        working-directory: candidate-package
      - name: Run standalone candidate checks
        run: |
          npm run typecheck --if-present
          npm run lint --if-present
          npm run build --if-present
          npm test --if-present
        working-directory: candidate-package
      - name: Record standalone candidate export state
        run: |
          node ../tools/testpack/scripts/check-package-types.js \
            --package-dir . \
            --output ../artifacts/candidate-standalone-package-targets.json \
            --allow-invalid
        working-directory: candidate-package
      - name: Replace submodule with candidate SHA
        env:
          PACKAGE_PATH: ${{ needs.prepare.outputs.path }}
          PR_SHA: ${{ inputs.pr-sha }}
        run: |
          git -C "${PACKAGE_PATH}" fetch "$GITHUB_WORKSPACE/candidate-package" "${PR_SHA}"
          git -C "${PACKAGE_PATH}" checkout --detach "${PR_SHA}"
          ACTUAL_SHA=$(git -C "${PACKAGE_PATH}" rev-parse --verify HEAD)
          if [ "${ACTUAL_SHA}" != "${PR_SHA,,}" ]; then
            echo "Submodule checkout ${ACTUAL_SHA} does not match ${PR_SHA}"
            exit 1
          fi
        working-directory: metapackage
      - name: Resolve candidate metapackage lock and install
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          node ../tools/testpack/scripts/workspace-lock.js \
            --command overlay --package "$REPOSITORY_NAME" --workspace . \
            --standalone "$GITHUB_WORKSPACE/candidate-package" \
            --output "$GITHUB_WORKSPACE/artifacts/candidate-lock-plan.json"
          cp package-lock.json "$GITHUB_WORKSPACE/artifacts/candidate-metapackage-lock.json"
          node ../tools/testpack/scripts/workspace-lock.js \
            --command verify --workspace . \
            --plan "$GITHUB_WORKSPACE/artifacts/candidate-lock-plan.json" \
            --output "$GITHUB_WORKSPACE/artifacts/candidate-dependency-resolution.json"
        working-directory: metapackage
      - name: Install metapackage Playwright browser when required
        if: inputs.profile != 'document-transform'
        run: npx playwright install --with-deps chromium
        working-directory: metapackage/devops/testpack
      - name: Build candidate testpack dependency graph
        run: npm run build
        working-directory: metapackage
      - name: Prove the candidate components source reaches both consumers
        run: node tools/testpack/scripts/diagnostic-components-binding.cjs metapackage "$PR_SHA" artifacts/candidate-source-binding.json
      - name: Record candidate workspace export state
        env:
          PACKAGE_PATH: ${{ needs.prepare.outputs.path }}
        run: |
          node ../tools/testpack/scripts/check-package-types.js \
            --package-dir "${PACKAGE_PATH}" \
            --output ../artifacts/candidate-package-targets.json \
            --allow-invalid
        working-directory: metapackage
      - name: Run changed package tests in metapackage context
        env:
          PACKAGE_NAME: ${{ needs.prepare.outputs.name }}
        run: |
          node ../tools/testpack/scripts/workspace-infra.js "$PACKAGE_PATH"
          npm test --workspace "${PACKAGE_NAME}" --if-present
        working-directory: metapackage
      - name: Build candidate HTML and Markdown corpus
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/actual/html"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/actual/md"
          node ../../packages/cli/build/index.js build \
            -i docs/input \
            -o "$GITHUB_WORKSPACE/artifacts/actual/html/output" \
            --output-format html
          node ../../packages/cli/build/index.js build \
            -i docs/input \
            -o "$GITHUB_WORKSPACE/artifacts/actual/md/output" \
            --output-format md
        working-directory: metapackage/devops/testpack
      - name: Expose hoisted infra config to Playwright
        if: inputs.profile != 'document-transform'
        run: node ../tools/testpack/scripts/workspace-infra.js devops/testpack
        working-directory: metapackage
      - name: Run candidate browser and screenshot regression
        if: inputs.profile != 'document-transform'
        id: browser
        continue-on-error: true
        env:
          TESTPACK_ROOT: ${{ github.workspace }}/metapackage/devops/testpack
          CANDIDATE_CORPUS: ${{ github.workspace }}/artifacts/actual/html/output
          BROWSER_ARTIFACTS: ${{ github.workspace }}/artifacts
        run: |
          node "$GITHUB_WORKSPACE/tools/testpack/scripts/candidate-browser.js"
          npx playwright test \
            --config "$GITHUB_WORKSPACE/artifacts/candidate-playwright.config.ts" \
            --update-snapshots=none \
            --output "$GITHUB_WORKSPACE/artifacts/playwright-output" \
            --trace retain-on-failure \
            --retries=0 --max-failures=5
        working-directory: metapackage/devops/testpack
      - name: Record candidate downstream consumer state
        id: candidate-downstream
        continue-on-error: true
        run: |
          node tools/testpack/scripts/downstream-check.js \
            --package "$REPOSITORY_NAME" \
            --pr-sha "$PR_SHA" \
            --metapackage-root metapackage \
            --skip-corpus true \
            --output artifacts/candidate-downstream/ \
            --report artifacts/candidate-downstream-report.md
      - name: Recheck candidate resolutions after builds and consumer tests
        run: |
          node tools/testpack/scripts/workspace-lock.js \
            --command verify --workspace metapackage \
            --plan artifacts/candidate-lock-plan.json \
            --output artifacts/candidate-dependency-resolution.json
          node tools/testpack/scripts/diagnostic-components-binding.cjs metapackage "$PR_SHA" artifacts/candidate-source-binding.json
      - name: Upload isolated candidate evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.package }}-${{ inputs.pr-sha }}-${{ inputs.profile }}
          path: artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Fail for browser regressions
        if: steps.browser.outcome == 'failure'
        run: exit 1
  comparison:
    name: Trusted comparison (never executes package code)
    needs:
      - prepare
      - baseline
      - candidate
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REPOSITORY_NAME: ${{ inputs.package }}
      BASELINE_RESULT: ${{ needs.baseline.result }}
      CANDIDATE_RESULT: ${{ needs.candidate.result }}
    steps:
      - name: Require trusted workflow identity
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$WORKFLOW_REPOSITORY" == diplodoc-platform/testpack ]] || { echo 'Unexpected tool repository'; exit 1; }
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'Missing immutable workflow SHA'; exit 1; }
      - name: Require complete builds
        run: >-
          [[ "$BASELINE_RESULT" == success && "$CANDIDATE_RESULT" == success ]] || { echo
          "Incomplete verification builds"; exit 1; }
      - name: Checkout verification tools
        uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tools/testpack
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '24' }}
      - name: Download immutable baseline artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.baseline.outputs.artifact-id }}
          path: baseline
          merge-multiple: true
      - name: Download immutable candidate artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact-id }}
          path: candidate
          merge-multiple: true
      - name: Compare HTML, Markdown, exports and consumers
        run: >-
          node tools/testpack/scripts/compare-verification.js --package "$REPOSITORY_NAME"
          --baseline baseline --candidate candidate --output reports
      - name: Upload trusted comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-comparison-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.package }}-${{ inputs.pr-sha }}-${{ inputs.profile }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
      - name: Write comparison summary
        if: always()
        run: >-
          if [ -f reports/verification-report.md ]; then cat reports/verification-report.md >>
          "$GITHUB_STEP_SUMMARY"; fi
